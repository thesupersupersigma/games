server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik + Cloudflare: keep redirects (e.g. /polytrack -> /polytrack/)
    # relative so they don't point at http://...:80
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm
               image/svg+xml application/manifest+json font/woff2;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles or dev-only files
    location ~ /\.                 { deny all; return 404; }
    location ~* \.(md|har)$        { return 404; }

    # PolyTrack scans these folders for .track files before using its built-in list
    location ~ ^/polytrack/tracks/(official|community)/$ {
        autoindex on;
    }

    # Big game assets: cache for a week
    location ~* \.(wasm|data|js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|ico|ogg|mp3|wav|glb|gltf|bin|track)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
