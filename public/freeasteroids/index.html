<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Asteroids</title>
	<link rel="icon" type="image/png" href="images/asteroids-game-icon-180.png" />
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #0e0e0e;
			overflow: hidden;
		}

		#game-container {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
		}

		/* The SWF is 640x480; scale it to fit the viewport, never upscale. */
		#game-container ruffle-player {
			width: min(100vw, 133.3333vh, 960px) !important;
			height: auto !important;
			aspect-ratio: 4 / 3;
		}
	</style>
</head>
<body>
	<div id="game-container"></div>

	<script src="ruffle/ruffle.js"></script>
	<script>
		window.addEventListener("load", function () {
			var ruffle = window.RufflePlayer.newest();
			var player = ruffle.createPlayer();
			player.style.backgroundColor = "#000";
			document.getElementById("game-container").appendChild(player);
			player.load("asteroids.swf");
		});
	</script>
</body>
</html>
